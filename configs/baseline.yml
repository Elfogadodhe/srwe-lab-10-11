S1:
  global:
    - hostname S1
    - vlan 10
    - exit
    - vlan 20
    - exit
    - vlan 99
    - exit
    - interface vlan 99
    - ip address 10.0.0.2 255.0.0.0
    - no shutdown
    - exit
    - ip default-gateway 10.0.0.1
    - ip domain-name lab.local
    - crypto key generate rsa modulus 1024
    - username admin privilege 15 secret cisco123
    - line vty 0 4
    - transport input telnet ssh
    - password ciscotelnet
    - login
    - exec-timeout 5 0
    - exit
    - ip http server
    # NINCS: port-security, snooping, DAI, guard-ok, IPSG, LLDP-tiltás,
    #        no cdp run, no ip redirects — ezek hiánya a sebezhetőség
  interfaces:
    FastEthernet0/1:
      - switchport mode access
      - switchport access vlan 10
      - spanning-tree portfast
    FastEthernet0/2:
      - switchport mode access
      - switchport access vlan 99
    FastEthernet0/3:
      - switchport mode access
      - switchport access vlan 10
      - spanning-tree portfast
    FastEthernet0/24:
      - switchport mode trunk
      - switchport trunk allowed vlan 10,20,99

S2:
  global:
    - hostname S2
    - vlan 10
    - exit
    - vlan 20
    - exit
    - vlan 99
    - exit
    - interface vlan 99
    - ip address 10.0.0.3 255.0.0.0
    - no shutdown
    - exit
    - ip default-gateway 10.0.0.1
    - ip domain-name lab.local
    - crypto key generate rsa modulus 1024
    - username admin privilege 15 secret cisco123
    - line vty 0 4
    - transport input telnet ssh
    - password ciscotelnet
    - login
    - exec-timeout 5 0
    - exit
  interfaces:
    FastEthernet0/1:
      - switchport mode access
      - switchport access vlan 20
    FastEthernet0/24:
      - switchport mode trunk
      - switchport trunk allowed vlan 10,20,99

R1:
  global:
    - hostname R1
    # Router-on-a-stick: R1 egyetlen trunk-kapcsolaton (Gi0/1) éri el az összes VLAN-t.
    # A VLAN 99 (menedzsment) átjárója a Gi0/1.99 .254-en — ez a switchek default-gateway-e.
    - interface GigabitEthernet0/1
    - no shutdown
    - exit
    - interface GigabitEthernet0/1.10
    - encapsulation dot1Q 10
    - ip address 172.16.10.1 255.255.255.0
    - exit
    - interface GigabitEthernet0/1.20
    - encapsulation dot1Q 20
    - ip address 172.16.20.1 255.255.255.0
    - exit
    - interface GigabitEthernet0/1.99
    - encapsulation dot1Q 99
    - ip address 10.0.0.1 255.0.0.0
    - exit
    # NINCS 'no ip redirects' — az ICMP-redirect támadás (12. fázis) miatt
  dhcp_pool:
    - ip dhcp excluded-address 172.16.10.1 172.16.10.10
    - ip dhcp pool USERS
    - network 172.16.10.0 255.255.255.0
    - default-router 172.16.10.1
    - dns-server 172.16.10.1
    - exit
